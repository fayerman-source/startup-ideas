<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background:
      radial-gradient(ellipse 1100px 560px at 50% 42%, rgba(37, 47, 70, 0.55), rgba(21, 26, 40, 0) 70%),
      #151a28;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 1120px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }
  .eyebrow {
    color: #ffbf75;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  h1 {
    color: #f8fbff;
    font-size: 84px;
    font-weight: 700;
    line-height: 1.06;
    letter-spacing: -0.015em;
  }
  .sub {
    color: #a9b5cc;
    font-size: 30px;
    font-weight: 500;
  }
  .sub b { color: #f8fbff; font-weight: 600; }
  .pills { display: flex; gap: 16px; margin-top: 6px; }
  .pill {
    background: rgba(27, 35, 52, 0.97);
    border: 1px solid rgba(115, 130, 154, 0.55);
    border-radius: 999px;
    padding: 12px 26px;
    color: #dbe4f2;
    font-size: 22px;
    font-weight: 500;
    white-space: nowrap;
  }
  .brand {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #e8d44d;
    font-size: 26px;
    font-weight: 700;
  }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #e8d44d;
    box-shadow: 0 0 18px rgba(232, 212, 77, 0.55);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Refreshed monthly</div>
    <h1>Startup Ideas<br>Worth Building</h1>
    <div class="sub"><b>Real problem spaces</b> sourced from public pain signals</div>
    <div class="pills">
      <div class="pill">grouped by market</div>
      <div class="pill">every seed cites its source</div>
      <div class="pill">free to validate</div>
    </div>
    <div class="brand"><span class="dot"></span>1mil.app</div>
  </div>
</body>
</html>
